path = "tests/v02_resources_tests.rs"

[[test]]
name = "v02_shutdown"
path = "tests/v02_shutdown_tests.rs"

[[test]]
name = "v02_tree"
path = "tests/v02_tree_tests.rs"

[[test]]
name = "v02_report"
path = "tests/v02_report_tests.rs"

[[test]]
name = "v02_production"
path = "tests/v02_production_tests.rs"

[[test]]
name = "v02_service_resource"
path = "tests/v02_service_resource_tests.rs"

[[test]]
name = "v03_contract"
path = "tests/v03_contract_tests.rs"

[[test]]
